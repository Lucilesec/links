<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucilesec — Links</title>
<meta name="description" content="Lucilesec — リンク集">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #F7F2E3;
    --surface: #F0EBD8;
    --surface-hover: #18120A;
    --text: #18120A;
    --text-invert: #F7F2E3;
    --muted: #8a7f68;
    --border: #ddd4ba;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Mono', monospace;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.25rem;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    width: 100%;
    max-width: 460px;
  }

  header {
    margin-bottom: 2.75rem;
    padding-bottom: 1.75rem;
    border-bottom: 1px solid var(--border);
  }

  .tag {
    font-size: 0.68rem;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 0.7rem;
    margin-bottom: 1.25rem;
  }

  .tag::before {
    content: "";
    width: 24px; height: 1px;
    background: var(--muted);
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-size: clamp(2.5rem, 9vw, 3.4rem);
    line-height: 1.04;
    letter-spacing: -0.015em;
    font-optical-sizing: auto;
  }

  .sub {
    margin-top: 0.9rem;
    color: var(--muted);
    font-size: 0.82rem;
    line-height: 1.65;
  }

  nav {
    display: flex;
    flex-direction: column;
    gap: 0.65rem;
  }

  .link {
    display: flex;
    align-items: center;
    gap: 1rem;
    padding: 1.05rem 1.2rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    text-decoration: none;
    color: var(--text);
    transition: background 0.22s ease, color 0.22s ease,
                border-color 0.22s ease, transform 0.22s ease;
  }

  .link:hover {
    background: var(--surface-hover);
    color: var(--text-invert);
    border-color: var(--surface-hover);
    transform: translateX(4px);
  }

  .link:focus-visible {
    outline: 2px solid var(--text);
    outline-offset: 3px;
  }

  .icon {
    flex-shrink: 0;
    width: 21px; height: 21px;
    transition: color 0.22s ease;
  }

  .meta { flex: 1; min-width: 0; }

  .label {
    font-size: 0.66rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--muted);
    transition: color 0.22s ease;
  }

  .link:hover .label { color: #b3a482; }

  .value {
    font-size: 0.93rem;
    margin-top: 0.2rem;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .arrow {
    color: var(--muted);
    transition: transform 0.22s ease, color 0.22s ease;
  }

  .link:hover .arrow {
    color: var(--text-invert);
    transform: translate(2px, -2px);
  }

  footer {
    margin-top: 2.75rem;
    padding-top: 1.5rem;
    border-top: 1px solid var(--border);
    text-align: center;
    font-size: 0.66rem;
    color: var(--muted);
    letter-spacing: 0.18em;
  }

  /* 読み込み時のフェードイン */
  .reveal { opacity: 0; transform: translateY(12px); animation: rise 0.6s ease forwards; }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  header { animation-delay: 0.05s; }
  .link:nth-child(1) { animation-delay: 0.15s; }
  .link:nth-child(2) { animation-delay: 0.23s; }
  .link:nth-child(3) { animation-delay: 0.31s; }
  .link:nth-child(4) { animation-delay: 0.39s; }
  footer { animation-delay: 0.5s; }

  @media (prefers-reduced-motion: reduce) {
    .reveal { animation: none; opacity: 1; transform: none; }
    .link:hover { transform: none; }
  }
</style>
</head>
